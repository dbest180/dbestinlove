title: DBest In Love
tagline: 10 Years Apart · Together Forever
description: >-
  A 10-year long-distance (LDR) journey. We met in a comment section nobody
  remembers, and spent ten years, three countries, and three years of a pandemic
  apart — this is our love story.
author: DBest In Love
tiktok: https://www.tiktok.com/@dbestinlove

# GitHub Pages
url: "https://dbest180.github.io"
baseurl: "/dbestinlove"

markdown: kramdown
plugins:
  - jekyll-seo-tag

# The social share image. jekyll-seo-tag reads the image from the PAGE, not from
# a top-level site key — a bare `image:` above does nothing and silently emits no
# og:image (twitter:card falls back to "summary"). Front-matter defaults are the
# only way to set it once for every page. See HANDOFF.md gotcha 6.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.jpg

exclude:
  - README.md
  - HANDOFF.md
  - Gemfile
  - Gemfile.lock
  - .github/
